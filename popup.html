<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header-text">
          <h1>User-Agent Spoofer</h1>
          <p id="status">Отключено</p>
        </div>
        <button class="icon-btn" id="theme-btn" title="Сменить тему">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
        <label class="switch">
          <input type="checkbox" id="toggle" />
          <span class="slider"></span>
        </label>
      </header>

      <nav class="tabs">
        <button class="tab active" data-tab="profiles">Профили</button>
        <button class="tab" data-tab="exceptions">Исключения</button>
      </nav>

      <section class="panel panel-profiles active" id="panel-profiles">
        <div class="list" id="list"></div>
        <footer class="footer">
          <button id="custom-btn">Свой User-Agent</button>
        </footer>
      </section>

      <section class="panel panel-exceptions" id="panel-exceptions">
        <div class="exc-add">
          <input type="text" id="exc-input" placeholder="example.com" />
          <button id="exc-add-btn">Добавить</button>
        </div>
        <div class="list" id="exc-list"></div>
        <footer class="footer">
          <button id="exc-clear-btn">Очистить всё</button>
        </footer>
      </section>
    </div>

    <script src="presets.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
